spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: budget-monolith
              uri: http://monolith:8080   # имя сервиса в docker-compose
              predicates:
                - Path=/api/**

server:
  port: 8081

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

app:
  auth-service:
    url: http://monolith:8080
  internal:
    token: ${INTERNAL_TOKEN:default-secret-change-in-production}
